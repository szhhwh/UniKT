server:
  port: 8080
  servlet:
    session:
      cookie:
        # 会话 Cookie：HttpOnly 由 Spring 默认开启；Strict 防跨站携带
        same-site: strict
        max-age: 7d

spring:
  application:
    name: unikt-saas-backend
  datasource:
    # 默认零配置本地 H2 文件库；生产切 MySQL 只需覆盖：
    #   SPRING_DATASOURCE_URL=jdbc:mysql://host:3306/unikt?useSSL=false
    #   SPRING_DATASOURCE_USERNAME=... SPRING_DATASOURCE_PASSWORD=...
    url: jdbc:h2:file:./data/unikt-saas
    username: sa
    password: ${UNIKT_DB_PASSWORD:unikt-local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

unikt:
  # Python 推理服务地址（web-saas/inference；WSL 时常配隧道或直连其 IP）
  inference-base-url: http://localhost:8100
  inference-timeout-ms: 15000
  # Sphinx 构建产物目录（/docs-static/** 静态托管）；相对路径以进程工作目录为基准
  docs-dir: ../docs-build
  # 实验中心（web/ 管理器）地址，空 = 未配置（首页状态卡显示"未配置"）
  exp-base-url: ""
  # 本地 web-saas/inference 源码目录（节点部署时 rsync 的来源）
  inference-src: ../inference
  # 节点部署的并发数与单步 SSH 超时
  deploy-timeout-ms: 600000
  # 开放 API 每密钥每日调用配额
  quota-daily: 2000
  # 推理服务共享密钥：设置后所有对推理服务的调用带 X-Inference-Token，
  # 且部署到节点的 systemd 单元会注入同名环境变量（两侧需一致）
  inference-token: ${UNIKT_INFERENCE_TOKEN:}
  # 生产部署：前端构建产物目录（npm run build 后的 dist）。
  # 配置后由本服务托管前端，只暴露 8080 一个端口；空 = 开发模式走 Vite 5174
  frontend-dir: ${UNIKT_FRONTEND_DIR:}

logging:
  level:
    cn.ouc.luminatrail.unikt: INFO
