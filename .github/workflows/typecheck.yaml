name: Typecheck

on:
    pull_request:
        types: [opened, synchronize]
    push:
        branches: [main]

jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: prefix-dev/setup-pixi@v0.10.1
              with:
                  pixi-version: v0.79.0
                  environments: cpu
                  activate-environment: true
                  locked: true
            - run: pixi run --environment cpu typecheck
