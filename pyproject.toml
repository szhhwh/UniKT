[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle
    "RUF", # Ruff-specific
]

ignore = [
    "E501",   # line too long
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"model/**/*.py" = ["D", "RUF"]
# Tests are self-documenting via descriptive test_/class names; no docstrings.
"tests/**/*.py" = ["D"]
# The backend carries user-facing Chinese messages (fullwidth punctuation is
# correct Chinese typography, not an ambiguous copy of an ASCII symbol).
"web/backend/**/*.py" = ["RUF001", "RUF002", "RUF003"]
# The SaaS inference service follows the same convention.
"web-saas/inference/**/*.py" = ["RUF001", "RUF002", "RUF003"]
# The generic upload datasource raises user-facing Chinese errors (same convention).
"utils/data_process/generic.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["utils", "model"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Optional deps (mamba_ssm, xlstm, ...) may be absent: skip stub resolution
ignore_missing_imports = true
# Disambiguate same-named conftest.py modules under tests/
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = '''(?x)(
    ^runs/
    | ^swanlog/
    | ^data/
    | ^docs/
    | ^\.pixi/
    | ^model/
  )'''

# exclude only stops recursive discovery: imports of model.* from entry
# scripts still pull the modules in, so errors are silenced per-module
# instead. model/ stays outside the annotation gate entirely.
[[tool.mypy.overrides]]
module = "model.*"
ignore_errors = true
