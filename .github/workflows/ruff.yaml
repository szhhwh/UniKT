---
name: Ruff

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    ruff:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: prefix-dev/setup-pixi@v0.10.1
              with:
                  pixi-version: v0.84.2
                  environments: cpu
                  activate-environment: true
                  locked: true
            - run: pixi run --environment cpu lint
            - run: pixi run --environment cpu fmt -- --check --diff
